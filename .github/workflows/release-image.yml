# Builds the obfuscated backend image and pushes it to the private GitHub
# Container Registry. Customers only pull this image; they never get the source.
#
#   git tag v1.2.0 && git push origin v1.2.0      -> ghcr.io/<owner>/secure-patrol-backend:1.2.0 and :latest
#   Actions -> "Release image" -> Run workflow      -> manual build of the current branch
name: Release image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/secure-patrol-backend
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: OBFUSCATE=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
