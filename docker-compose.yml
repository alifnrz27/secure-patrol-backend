# Secure Patrol backend. PostgreSQL already runs on the server; the frontend runs separately.
#
#   docker compose up -d --build                  start / rebuild and restart
#   docker compose --profile redis up -d --build  also start Redis (needed for more than one backend container)
#
# All configuration comes from .env next to this file (see docs/DEPLOYMENT.md).

services:
  backend:
    build: .
    image: secure-backend:latest
    container_name: secure-backend
    restart: unless-stopped
    env_file: .env
    # Only reachable from this server (nginx); not exposed to the internet.
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    volumes:
      - backend-storage:/app/storage
      - backend-logs:/app/logs
    # Lets DB_HOST = "host.docker.internal" reach PostgreSQL installed on this server.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:7-alpine
    container_name: secure-redis
    restart: unless-stopped
    profiles: ["redis"]

volumes:
  # Fixed names so the data survives a rename of the project folder.
  backend-storage:
    name: secure-backend-storage
  backend-logs:
    name: secure-backend-logs
