  /patrol-shifts:
    get:
      operationId: listPatrolShifts
      tags: [Patrol Shifts]
      summary: Daftar pengaturan shift
      description: 'Semua user yang login, semua platform. Setiap unit punya shift sendiri; user unit hanya melihat shift unitnya. Diurutkan berdasarkan unit dan jam mulai.'
      parameters:
        - $ref: '#/components/parameters/UnitId'
      responses:
        '200':
          description: Daftar shift
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PatrolShift' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createPatrolShift
      tags: [Patrol Shifts]
      summary: Tambah shift
      description: |
        **Hanya platform web.** Akses: Kepala Keamanan, Admin Keamanan; shift dibuat di unit user tersebut.
        Pusat tidak mengatur shift (`403`). Unit baru otomatis mendapat 3 shift default.
        Jam akhir adalah batas (cut-off): scan tepat di jam akhir atau sesudahnya masuk ke shift berikutnya.
        Shift aktif dalam satu unit tidak boleh tumpang tindih. Perubahan hanya berlaku untuk group berikutnya.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePatrolShiftRequest' }
      responses:
        '201':
          description: Shift dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatrolShiftResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Tumpang tindih dengan shift aktif lain, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /patrol-shifts/{id}:
