                          items:
                            type: array
                            items: { $ref: '#/components/schemas/PatrolListItem' }
                          pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /patrol-scans:
    post:
      operationId: scanPatrolPoint
      tags: [Patrol Scans]
      summary: Scan NFC titik patroli
      description: |
        **Hanya platform android/ios.** Satu NFC boleh di-scan berkali-kali dalam shift yang sama.
        Hanya user unit yang bisa scan, dan hanya titik milik unitnya (`403 this patrol point belongs to another unit`;
        user pusat tidak bisa login di mobile). Radius dan setting lain memakai setting unit.

        - Shift ditentukan dari `scanned_at` (waktu scan di HP), sehingga scan offline yang dikirim belakangan
          tetap masuk ke shift yang benar. Maksimal setting `patrol_max_offline_hours` (default 24 jam) ke belakang.
        - `client_scan_id` unik per scan (misalnya UUID). Kirim ulang dengan ID yang sama tidak membuat data ganda
          dan dijawab `200` berisi scan yang sudah tersimpan.
        - Jika titik mewajibkan lokasi: jarak maksimal setting `patrol_location_radius_meters` (default 100 m), selebihnya ditolak.
        - Jika titik mewajibkan wajah: `face_verified` harus `true` (pencocokan wajah dilakukan di HP dengan ambang
          `face_mobile_accuracy`). Jika setting `face_match_min_score` lebih dari 0, `face_match_score` juga wajib dan
          minimal sebesar nilai tersebut.
        - `note` wajib jika `condition` = `abnormal`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/PatrolScanRequest' }
            encoding:
              photos:
                contentType: image/jpeg, image/png
      responses:
        '200':
          description: Scan dengan client_scan_id ini sudah pernah tersimpan (retry)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatrolScanResponse' }
        '201':
          description: Scan tersimpan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatrolScanResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: NFC tidak terdaftar sebagai titik patroli, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422':
          description: |
            Ditolak. Contoh pesan: `you are 240 m away from the patrol point, the maximum allowed distance is 100 m`,
            `face validation is required for this patrol point and was not verified`,
            `there is no active patrol shift at the scan time`, `scan is too old to be submitted`,
            `a scan can have at most 3 photos`, `file size must not exceed 5 MB`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      operationId: listPatrolScans
      tags: [Patrol Scans]
      summary: History scan (per group, shift, periode, atau semua)
      description: |
        Tanpa filter mengembalikan seluruh history. Tim Keamanan hanya melihat scan miliknya sendiri;
        Kepala/Admin Keamanan melihat semua scan unitnya; pusat melihat semua unit. Diurutkan dari scan terbaru.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/UnitId'
        - name: group_id
          in: query
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/ShiftId'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - name: scanned_by
          in: query
          schema: { type: integer, format: int64 }
        - name: patrol_point_id
          in: query
          schema: { type: integer, format: int64 }
        - name: condition
          in: query
          schema: { type: string, enum: [normal, abnormal] }
      responses:
        '200':
          description: History scan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/PatrolScan' }
                          pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /patrol-scans/export:
    get:
      operationId: exportPatrolScans
      tags: [Patrol Scans]
      summary: Export Excel riwayat scan
      description: |
        **Hanya platform web.** Menghasilkan file `.xlsx` dengan sheet **Riwayat Scan** dan **Filter**.
        Kolom: Waktu scan, Diterima server, Dikirim offline, Tanggal shift, Unit, Shift, Titik, Lokasi, Kondisi, Catatan,
        Petugas, Email petugas. User unit hanya mengekspor data unitnya. Waktu ditulis sebagai tanggal Excel dalam zona waktu aplikasi (WIB), diurutkan dari
        scan terlama. "Dikirim offline" = Ya jika diterima server lebih dari 5 menit setelah waktu scan.
        Maksimal 50.000 baris per file.
      parameters:
        - $ref: '#/components/parameters/UnitId'
        - $ref: '#/components/parameters/ShiftId'
        - name: patrol_point_id
          in: query
          schema: { type: integer, format: int64 }
        - name: scanned_by
          in: query
          description: ID petugas
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          description: File Excel
          headers:
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="riwayat-scan_20260929-163000.xlsx"' }
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: '`date_from must not be after date_to`, format tanggal salah, atau lebih dari 50.000 baris'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /patrol-scans/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getPatrolScan
      tags: [Patrol Scans]
      summary: Detail scan
      responses:
        '200':
          description: Detail scan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatrolScanResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

