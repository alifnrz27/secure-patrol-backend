      responses:
        '200':
          description: Daftar artikel
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/HelpDeskArticle' }
                          pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      operationId: createHelpDeskArticle
      tags: [Help Desk]
      summary: Tambah artikel
      description: '**Hanya platform web.** Akses: Super-Admin (help desk dikelola pusat).'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateHelpDeskArticleRequest' }
      responses:
        '201':
          description: Artikel dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HelpDeskArticleResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /help-desk-articles/reorder:
    put:
      operationId: reorderHelpDeskArticles
      tags: [Help Desk]
      summary: Atur ulang urutan artikel dalam satu kategori
      description: |
        **Hanya platform web.** Akses: Super-Admin. Untuk drag & drop di menu help desk. Kirim **semua** artikel kategori tersebut
        (termasuk draft) dalam urutan baru; `sort_order` disusun ulang menjadi 1, 2, 3, dan seterusnya.
        Daftar yang tidak lengkap, berisi ID ganda, atau berisi artikel dari kategori lain ditolak (422).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReorderHelpDeskArticlesRequest' }
      responses:
        '200':
          description: Artikel kategori tersebut dalam urutan baru
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/HelpDeskArticle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /help-desk-articles/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getHelpDeskArticle
      tags: [Help Desk]
      summary: Detail artikel
      description: 'Draft mengembalikan 404 selain untuk Super-Admin dan Manager Keamanan.'
      responses:
        '200':
          description: Detail artikel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HelpDeskArticleResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateHelpDeskArticle
      tags: [Help Desk]
      summary: Ubah artikel
      description: '**Hanya platform web.**'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateHelpDeskArticleRequest' }
      responses:
        '200':
          description: Artikel diubah
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HelpDeskArticleResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: deleteHelpDeskArticle
      tags: [Help Desk]
      summary: Hapus artikel (soft delete)
      description: '**Hanya platform web.**'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [Audit Log]
      summary: Riwayat create, update, dan delete
      description: |
        **Hanya platform web.** Akses: Super-Admin dan Manager Keamanan.
        Dicatat otomatis untuk setiap request POST/PUT/DELETE yang berhasil (tidak termasuk login, refresh, dan logout),
        serta pembuatan data lewat CLI (`source = "cli"`). Isi request tidak disimpan. Terbaru dulu.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: search
          in: query
          description: Cari di path atau IP, atau ID data yang sama persis
          schema: { type: string }
        - name: user_id
          in: query
          schema: { type: integer, format: int64 }
        - name: unit_id
          in: query
          description: Hanya perubahan oleh user unit ini
          schema: { type: integer, format: int64 }
        - name: action
          in: query
          schema: { type: string, enum: [create, update, delete] }
        - name: resource
          in: query
          schema: { type: string, example: users }
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          description: Daftar log
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/AuditLog' }
                          pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /settings:
    get:
      operationId: listSettings
      tags: [Settings]
      summary: Daftar pengaturan sistem
      description: |
        **Hanya platform web.** Akses baca: Super-Admin, Manager Keamanan, Kepala Keamanan, Admin Keamanan.
        Berisi nilai saat ini, nilai default, tipe, dan batas setiap setting.
        User unit melihat setting unitnya (`level` = `unit`). User pusat melihat setting global, atau setting
        sebuah unit dengan `?unit_id=`.
      parameters:
        - $ref: '#/components/parameters/UnitId'
      responses:
        '200':
          description: Semua setting
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateSettings
      tags: [Settings]
      summary: Ubah pengaturan sistem
      description: |
        **Hanya platform web.** Ubah satu atau beberapa setting sekaligus; perubahan langsung berlaku tanpa restart
        dan tercatat di audit log. Jika satu nilai tidak valid, tidak ada yang disimpan.
        - **Super-Admin** mengubah nilai **global** (dipakai semua unit yang tidak mengisi nilai sendiri).
          `null` = kembali ke default.
        - **Kepala/Admin Keamanan** mengubah nilai **unitnya**. `null` = unit kembali mengikuti nilai global.
        - Manager Keamanan hanya membaca.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: object
                  additionalProperties: true
                  example: { patrol_location_radius_meters: 150, face_mobile_accuracy: 0.8, face_match_min_score: null }
      responses:
        '200':
          description: Semua setting setelah diubah
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: 'Contoh: `patrol_location_radius_meters must be between 1 and 10000`, `max_speed: unknown setting`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /branding:
    get:
      operationId: getBranding
      tags: [Branding]
      summary: Nama dan logo aplikasi
      description: |
        **Tanpa login** (cukup request bertanda tangan App Client), semua platform, supaya halaman login bisa
        menampilkan nama dan logo. `logo_base64` = `null` berarti aplikasi memakai logo bawaannya.
        Simpan di cache; unduh ulang logo hanya jika `logo_updated_at` berubah.
      security:
        - AppId: []
          AppKey: []
      responses:
        '200':
          description: Branding saat ini
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandingResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: updateBranding
      tags: [Branding]
      summary: Ubah nama dan logo aplikasi
      description: |
        **Hanya platform web.** Akses: Super-Admin. Berlaku untuk semua unit dan tercatat di audit log.
        Logo JPEG/PNG maksimal 1 MB (disarankan persegi, PNG transparan). Tanpa file `logo`, logo lama tetap
        dipakai; `remove_logo=true` menghapus logo sehingga aplikasi kembali memakai logo bawaan.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/UpdateBrandingRequest' }
            encoding:
              logo:
                contentType: image/jpeg, image/png
      responses:
        '200':
          description: Branding setelah diubah
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandingResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422':
          description: '`logo size must not exceed 1 MB`, `file must be a JPEG or PNG image`, atau `app_name` kosong / lebih dari 100 karakter'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

components:
  securitySchemes:
    AppId:
      type: apiKey
      in: header
      name: X-App-Id
      description: App ID aplikasi, contoh `sp_web_k3m9qx2ht5vbn4rw_w8xq2a`.
    AppKey:
      type: apiKey
      in: header
      name: X-App-Key
      description: |
        Khusus halaman dokumentasi. App Key dipakai browser untuk membuat `X-Signature`
        lalu dihapus dari request, sehingga tidak pernah terkirim ke server.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token dari `/auth/login`. Terisi otomatis setelah login di halaman ini.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    Search:
      name: search
      in: query
      schema: { type: string }
    UnitId:
      name: unit_id
      in: query
      description: Filter unit, hanya untuk user pusat (Super-Admin, Manager Keamanan). Diabaikan untuk user unit.
      schema: { type: integer, format: int64 }
    ShiftId:
      name: shift_id
      in: query
      schema: { type: integer, format: int64 }
    DateFrom:
      name: date_from
      in: query
      description: Tanggal shift mulai (YYYY-MM-DD), inklusif
      schema: { type: string, format: date, example: '2026-09-01' }
    DateTo:
      name: date_to
      in: query
      description: Tanggal shift akhir (YYYY-MM-DD), inklusif
      schema: { type: string, format: date, example: '2026-09-30' }

  responses:
    FacePhotoRejected:
      description: |
        Validasi gagal. Selain error field biasa, pesan untuk foto wajah:
        `no face detected in the photo, use a clear and well lit photo of the face`,
        `the photo must contain exactly one face, N faces were found`,
        `the face is too small, take the photo closer so the face fills more of the picture`,
        `the face must look straight at the camera with both eyes visible`,
        `face photo could not be read as an image`, `file must be a JPEG or PNG image`, `file size must not exceed 5 MB`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PayloadTooLarge:
      description: |
        Body request lebih dari 20 MB. Server menolak sebelum membaca body lalu menutup koneksi,
        sehingga beberapa HTTP client melaporkan error koneksi (broken pipe) alih-alih response ini.
        Validasi ukuran foto (maksimal 5 MB) sebaiknya juga dilakukan di aplikasi sebelum upload.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Success:
      description: Berhasil
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    BadRequest:
      description: Aksi tidak diizinkan untuk data ini
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: App signature atau token tidak valid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Role tidak memiliki akses
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Data sudah dipakai (misalnya email atau kode role)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: Input tidak valid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Image:
      description: File gambar
      content:
        image/jpeg:
          schema: { type: string, format: binary }
        image/png:
          schema: { type: string, format: binary }

  schemas:
    Meta:
      type: object
      properties:
        message: { type: string, example: Login success }
        code: { type: integer, example: 200 }
        status: { type: string, example: success }
    Envelope:
      type: object
      properties:
        meta: { $ref: '#/components/schemas/Meta' }
        data: {}
    ErrorResponse:
      type: object
      properties:
        meta:
          allOf:
            - $ref: '#/components/schemas/Meta'
          example: { message: Validation error, code: 422, status: Error }
        data:
          description: Detail error (string, daftar pesan validasi, atau null)
          oneOf:
            - type: string
            - type: array
              items: { type: string }
    Pagination:
      type: object
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 10 }
        total: { type: integer, example: 42 }
        total_pages: { type: integer, example: 5 }

    UnitSummary:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        code: { type: string, example: UNIT-UTAMA }
        name: { type: string, example: Unit Utama }
        latitude: { type: number, format: double, example: -6.2250138 }
        longitude: { type: number, format: double, example: 106.8008324 }
        is_active: { type: boolean, example: true }
    Unit:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        code: { type: string, example: UNIT-UTAMA }
        name: { type: string, example: Unit Utama }
        latitude: { type: number, format: double, example: -6.2250138 }
        longitude: { type: number, format: double, example: 106.8008324 }
        is_active: { type: boolean, example: true, description: Unit nonaktif = semua user unit tidak bisa login }
        users_count: { type: integer, example: 12 }
        patrol_points_count: { type: integer, example: 15 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UnitResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Unit' }
    CreateUnitRequest:
      type: object
      required: [code, name, latitude, longitude]
      properties:
        code: { type: string, maxLength: 20, example: JKT-01 }
        name: { type: string, maxLength: 150, example: Unit Jakarta 1 }
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        is_active: { type: boolean, default: true }
    UpdateUnitRequest:
      type: object
      required: [code, name, latitude, longitude, is_active]
      properties:
        code: { type: string, maxLength: 20 }
        name: { type: string, maxLength: 150 }
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        is_active: { type: boolean }
    Role:
      type: object
      properties:
        id: { type: integer, format: int64, example: 5 }
        code: { type: string, example: security_team }
        name: { type: string, example: Tim Keamanan }
        description: { type: string, example: Petugas patroli keamanan di lapangan }
        is_system: { type: boolean, example: true }
        is_active: { type: boolean, example: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RoleResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Role' }
    CreateRoleRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          description: Huruf kecil, angka, atau underscore; diawali huruf; 3-50 karakter. Tidak bisa diubah.
          example: supervisor_shift
        name: { type: string, maxLength: 100, example: Supervisor Shift }
        description: { type: string, maxLength: 255 }
        is_active: { type: boolean, default: true }
    UpdateRoleRequest:
      type: object
      required: [name, is_active]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 255 }
        is_active: { type: boolean }

    User:
      type: object
      properties:
        id: { type: integer, format: int64, example: 6 }
        name: { type: string, example: Budi Santoso }
        email: { type: string, format: email, example: budi@securepatrol.local }
        role:
          type: object
          properties:
            id: { type: integer, format: int64, example: 5 }
            code: { type: string, example: security_team }
            name: { type: string, example: Tim Keamanan }
        unit_id: { type: integer, format: int64, nullable: true, example: 1, description: null untuk user pusat }
        unit:
          type: object
          nullable: true
          description: Unit user; null untuk user pusat
          allOf:
            - $ref: '#/components/schemas/UnitSummary'
        is_active: { type: boolean, example: true }
        is_locked: { type: boolean, example: false, description: Terkunci karena terlalu banyak salah password }
        face_photo_url: { type: string, nullable: true, example: /api/v1/users/6/face-photo }
        face_photo_updated_at:
          type: string
          format: date-time
          nullable: true
          description: Berubah setiap foto wajah diganti. Aplikasi mobile mengunduh ulang foto jika nilainya berbeda dari cache.
        last_login_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/User' }
    CreateUserRequest:
      type: object
      required: [name, email, password, password_confirmation, role_id, face_photo]
      properties:
        name: { type: string, maxLength: 150 }
        email: { type: string, format: email, description: Harus unik }
        password:
          type: string
          format: password
          description: 8-72 karakter, minimal satu huruf dan satu angka
        password_confirmation: { type: string, format: password }
        role_id: { type: integer, format: int64 }
        unit_id: { type: integer, format: int64, description: 'Wajib untuk role unit jika dibuat Super-Admin. Diabaikan untuk role pusat dan jika dibuat Kepala/Admin Keamanan.' }
        face_photo: { type: string, format: binary, description: 'Wajib. JPEG/PNG, maksimal 5 MB (5.242.880 byte)' }
        is_active: { type: boolean, default: true }
    UpdateUserRequest:
      type: object
      required: [name, email, role_id, is_active]
      properties:
        name: { type: string, maxLength: 150 }
        email: { type: string, format: email }
        role_id: { type: integer, format: int64 }
        unit_id: { type: integer, format: int64, description: 'Opsional. Kosong = tetap di unit sekarang.' }
        is_active: { type: boolean }
        face_photo: { type: string, format: binary, description: 'Opsional. JPEG/PNG, maksimal 5 MB' }
    ResetPasswordRequest:
      type: object
      required: [password, password_confirmation]
      properties:
        password: { type: string, format: password }
        password_confirmation: { type: string, format: password }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: superadmin@securepatrol.local }
        password: { type: string, format: password }
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    ChangePasswordRequest:
      type: object
      required: [old_password, password, password_confirmation]
      properties:
        old_password: { type: string, format: password }
        password: { type: string, format: password }
        password_confirmation: { type: string, format: password }
    Token:
      type: object
      properties:
        token_type: { type: string, example: Bearer }
        access_token: { type: string }
        expires_in: { type: integer, description: Detik sampai access token kedaluwarsa, example: 3600 }
        expires_at: { type: string, format: date-time }
        refresh_token: { type: string, description: Hanya bisa dipakai sekali }
        refresh_expires_at: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/LoginUser' }
        config: { $ref: '#/components/schemas/AppConfig' }
        settings: { $ref: '#/components/schemas/AppSettings' }
    AppConfig:
      type: object
      description: Pengaturan untuk aplikasi mobile (validasi sebelum scan dan mode offline).
      properties:
        server_time:
          type: string
          format: date-time
          description: 'Waktu server. Pakai untuk mengoreksi jam HP: request ditolak jika jam HP selisih lebih dari request_timestamp_tolerance_seconds.'
        timezone: { type: string, example: Asia/Jakarta }
        request_timestamp_tolerance_seconds: { type: integer, example: 300 }
        location_radius_meters: { type: number, example: 100, description: Radius maksimal untuk titik yang mewajibkan validasi lokasi }
        face_match_min_score: { type: number, nullable: true, example: 0.8, description: 'null = server hanya mengecek face_verified' }
        max_offline_hours: { type: integer, example: 24 }
        max_scan_photos: { type: integer, example: 3 }
        max_photo_size_bytes: { type: integer, example: 5242880 }
    LoginUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            face_photo_base64:
              type: string
              format: byte
              nullable: true
              description: Foto wajah (base64 standar). Hanya diisi saat login; null jika user belum punya foto.
            face_photo_mime_type:
              type: string
              nullable: true
              enum: [image/jpeg, image/png]
              example: image/jpeg
    TokenResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Token' }

    AppClient:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: Secure Patrol Android }
        platform: { type: string, enum: [android, ios, web, server] }
        app_id: { type: string, example: sp_and_k3m9qx2ht5vbn4rw_w8xq2a }
        key_hint: { type: string, example: '****s0yM' }
        description: { type: string }
        is_active: { type: boolean }
        expires_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }
        key_rotated_at: { type: string, format: date-time, nullable: true }
        previous_key_expires_at:
          type: string
          format: date-time
          nullable: true
          description: Batas waktu key lama masih diterima setelah rotasi
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AppClientResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/AppClient' }
    AppClientCredentialResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/AppClient'
                - type: object
                  properties:
                    app_key: { type: string, example: spk_-e2NwI_EJysxpO6hWXyKRxB4CWHpSDxm18PngULs0yM }
                    warning: { type: string }
    CreateAppClientRequest:
      type: object
      required: [name, platform]
      properties:
        name: { type: string, maxLength: 100 }
        platform: { type: string, enum: [android, ios, web, server] }
        description: { type: string, maxLength: 255 }
        expires_at: { type: string, format: date-time, nullable: true }
    UpdateAppClientRequest:
      type: object
      required: [name, is_active]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 255 }
        is_active: { type: boolean }
        expires_at: { type: string, format: date-time, nullable: true }
    RotateKeyRequest:
      type: object
      properties:
        grace_period_hours: { type: integer, minimum: 0, maximum: 168, default: 0 }

    PatrolPoint:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        unit_id: { type: integer, format: int64, example: 1 }
        name: { type: string, example: Main Gate }
        location: { type: string, example: Building A - Front Entrance }
        nfc_code: { type: string, example: '04:A2:1F:9C' }
        latitude: { type: number, format: double, example: -6.2250138 }
        longitude: { type: number, format: double, example: 106.8008324 }
        is_location_match_required:
          type: boolean
          description: Petugas harus berada di koordinat titik ini saat check-in
        is_face_validation_required:
          type: boolean
          description: Petugas harus lolos validasi wajah saat check-in
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PatrolPointResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/PatrolPoint' }
    CreatePatrolPointRequest:
      type: object
      required: [name, location, nfc_code, latitude, longitude]
      properties:
        name: { type: string, maxLength: 150, example: Main Gate }
        location: { type: string, maxLength: 255, example: Building A - Front Entrance }
        nfc_code: { type: string, maxLength: 100, example: '04:A2:1F:9C' }
        latitude: { type: number, format: double, minimum: -90, maximum: 90, example: -6.2250138 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180, example: 106.8008324 }
        is_location_match_required: { type: boolean, default: false }
        is_face_validation_required: { type: boolean, default: false }
    UpdatePatrolPointRequest:
      type: object
      required: [name, location, nfc_code, latitude, longitude, is_location_match_required, is_face_validation_required]
      properties:
        name: { type: string, maxLength: 150 }
        location: { type: string, maxLength: 255 }
        nfc_code: { type: string, maxLength: 100 }
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        is_location_match_required: { type: boolean }
        is_face_validation_required: { type: boolean }

    PatrolShift:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        unit_id: { type: integer, format: int64, example: 1 }
        name: { type: string, example: Shift 1 }
        start_time: { type: string, example: '08:00' }
        end_time: { type: string, example: '16:00', description: 'Batas akhir (cut-off). 24:00 diperbolehkan.' }
        duration_minutes: { type: integer, example: 480 }
        crosses_midnight: { type: boolean, example: false }
        is_active: { type: boolean, example: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PatrolShiftResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/PatrolShift' }
    CreatePatrolShiftRequest:
      type: object
      required: [name, start_time, end_time]
      properties:
        name: { type: string, maxLength: 100, example: Shift 1 }
        start_time: { type: string, pattern: '^\d{2}:\d{2}$', example: '08:00' }
        end_time: { type: string, pattern: '^\d{2}:\d{2}$', example: '16:00', description: 'Lebih kecil dari start_time berarti melewati tengah malam, misalnya 22:00-06:00.' }
        is_active: { type: boolean, default: true }
    UpdatePatrolShiftRequest:
      type: object
      required: [name, start_time, end_time, is_active]
      properties:
        name: { type: string, maxLength: 100 }
        start_time: { type: string, pattern: '^\d{2}:\d{2}$' }
        end_time: { type: string, pattern: '^\d{2}:\d{2}$' }
        is_active: { type: boolean }

    PatrolGroupSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        unit_id: { type: integer, format: int64 }
        unit_name: { type: string, example: Unit Utama }
        shift_id: { type: integer, format: int64 }
        shift_name: { type: string, example: Shift 1 }
        shift_date: { type: string, format: date, example: '2026-09-29' }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
    PatrolGroup:
      type: object
      properties:
        id: { type: integer, format: int64 }
        unit:
          type: object
          properties:
            id: { type: integer, format: int64 }
            code: { type: string, example: UNIT-UTAMA }
            name: { type: string, example: Unit Utama }
        shift:
          type: object
          properties:
            id: { type: integer, format: int64 }
            name: { type: string, example: Shift 1 }
        shift_date: { type: string, format: date, example: '2026-09-29', description: Tanggal shift dimulai }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        status: { type: string, enum: [upcoming, ongoing, finished] }
        progress:
          type: object
          properties:
            total_points: { type: integer, example: 15 }
            scanned_points: { type: integer, example: 12 }
            unscanned_points: { type: integer, example: 3 }
            total_scans: { type: integer, example: 20 }
            abnormal_scans: { type: integer, example: 1 }
        created_at: { type: string, format: date-time }
    PatrolGroupDetailResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PatrolGroup'
                - type: object
                  properties:
                    items:
                      type: array
                      items: { $ref: '#/components/schemas/PatrolListItem' }
    PatrolUserSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: Budi Santoso }
        email: { type: string, format: email }
    PatrolListItem:
      type: object
      description: Salinan titik patroli di dalam satu group.
      properties:
        id: { type: integer, format: int64 }
        group: { $ref: '#/components/schemas/PatrolGroupSummary' }
        patrol_point_id: { type: integer, format: int64 }
        name: { type: string, example: Main Gate }
        location: { type: string, example: Building A - Front Entrance }
        nfc_code: { type: string, example: '04:A2:1F:9C' }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        is_location_match_required: { type: boolean }
        is_face_validation_required: { type: boolean }
        is_scanned: { type: boolean }
        scan_count: { type: integer, example: 2 }
        last_scanned_at: { type: string, format: date-time, nullable: true }
        last_scanned_by:
          type: object
          allOf:
            - $ref: '#/components/schemas/PatrolUserSummary'
          nullable: true
        last_condition: { type: string, enum: [normal, abnormal], nullable: true }

    PatrolScanRequest:
      type: object
      required: [client_scan_id, nfc_code, condition, latitude, longitude]
      properties:
        client_scan_id: { type: string, maxLength: 64, description: 'ID unik dari HP (misalnya UUID) untuk mencegah data ganda saat sync ulang', example: 7f3c2a1e9b8d4c6fa0e1d2c3b4a59687 }
        nfc_code: { type: string, maxLength: 100, example: '04:A2:1F:9C' }
        condition: { type: string, enum: [normal, abnormal] }
        note: { type: string, maxLength: 1000, description: Wajib jika condition = abnormal }
        latitude: { type: number, format: double, minimum: -90, maximum: 90, example: -6.2250138 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180, example: 106.8008324 }
        scanned_at: { type: string, format: date-time, description: 'Waktu scan di HP (RFC3339). Kosong = waktu server.', example: '2026-09-29T08:15:00+07:00' }
        face_verified: { type: boolean, description: Hasil pencocokan wajah di HP }
        face_match_score: { type: number, format: double, minimum: 0, maximum: 1, example: 0.93 }
        photos:
          type: array
          maxItems: 3
          description: 'Maksimal 3 foto JPEG/PNG, masing-masing maksimal 5 MB'
          items: { type: string, format: binary }
    PatrolScan:
      type: object
      properties:
        id: { type: integer, format: int64 }
        client_scan_id: { type: string }
        group: { $ref: '#/components/schemas/PatrolGroupSummary' }
        patrol_point:
          type: object
          properties:
            patrol_list_item_id: { type: integer, format: int64 }
            patrol_point_id: { type: integer, format: int64 }
            name: { type: string, example: Main Gate }
            location: { type: string }
            nfc_code: { type: string }
        condition: { type: string, enum: [normal, abnormal] }
        note: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        distance_meters: { type: number, format: double, example: 12.4, description: Jarak HP ke titik saat scan }
        is_location_valid: { type: boolean, description: 'true jika jarak <= setting patrol_location_radius_meters' }
        is_face_verified: { type: boolean }
        face_match_score: { type: number, format: double, nullable: true }
        scanned_at: { type: string, format: date-time, description: Waktu scan di HP }
        received_at: { type: string, format: date-time, description: Waktu diterima server }
        scanned_by: { $ref: '#/components/schemas/PatrolUserSummary' }
        photos:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, format: int64 }
              url: { type: string, example: /api/v1/patrol-scans/10/photos/21 }
    PatrolScanResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/PatrolScan' }

    HelpDeskArticle:
      type: object
      properties:
        id: { type: integer, format: int64 }
        category: { type: string, enum: [rule, guide, faq], description: 'rule = aturan, guide = tata cara, faq = tanya jawab' }
        title: { type: string, example: Cara Melakukan Patroli (Scan NFC) }
        content: { type: string, description: Isi artikel dalam format Markdown }
        sort_order: { type: integer, example: 1 }
        is_published: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    HelpDeskArticleResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/HelpDeskArticle' }
    CreateHelpDeskArticleRequest:
      type: object
      required: [category, title, content]
      properties:
        category: { type: string, enum: [rule, guide, faq] }
        title: { type: string, maxLength: 200 }
        content: { type: string, maxLength: 20000, description: Markdown }
        sort_order: { type: integer, minimum: 0, description: 'Opsional. Kosong = ditempatkan paling akhir di kategorinya.' }
        is_published: { type: boolean, default: true, description: false = simpan sebagai draft }
    UpdateHelpDeskArticleRequest:
      type: object
      required: [category, title, content, is_published]
      properties:
        category: { type: string, enum: [rule, guide, faq] }
        title: { type: string, maxLength: 200 }
        content: { type: string, maxLength: 20000 }
        sort_order: { type: integer, minimum: 0, description: 'Opsional. Kosong = urutan tetap, atau paling akhir jika pindah kategori.' }
        is_published: { type: boolean }
    ReorderHelpDeskArticlesRequest:
      type: object
      required: [category, article_ids]
      properties:
        category: { type: string, enum: [rule, guide, faq] }
        article_ids:
          type: array
          minItems: 1
          uniqueItems: true
          description: Semua ID artikel kategori tersebut, dalam urutan baru
          items: { type: integer, format: int64 }
          example: [7, 4, 6, 5]
    AuditLog:
      type: object
      properties:
        id: { type: integer, format: int64 }
        action: { type: string, enum: [create, update, delete] }
        resource: { type: string, example: patrol-points }
        resource_id: { type: string, nullable: true, example: '12' }
        unit_id: { type: integer, format: int64, nullable: true, description: Unit user yang melakukan perubahan; null untuk pusat dan CLI }
        endpoint: { type: string, example: 'PUT /patrol-points/:id' }
        method: { type: string, example: PUT }
        path: { type: string, example: /api/v1/patrol-points/12 }
        status_code: { type: integer, example: 200 }
        user:
          type: object
          nullable: true
          description: null untuk aksi dari CLI
          properties:
            id: { type: integer, format: int64 }
            name: { type: string, example: Super Admin }
            email: { type: string, example: superadmin@securepatrol.local }
            role_code: { type: string, example: super_admin }
        app_platform: { type: string, example: web }
        ip_address: { type: string, example: 203.0.113.7 }
        user_agent: { type: string }
        source: { type: string, enum: [api, cli] }
        created_at: { type: string, format: date-time }
    AppSettings:
      type: object
      description: Setting yang dikirim ke aplikasi pada login, refresh, dan GET /auth/me. Diatur di /settings.
      properties:
        patrol_location_radius_meters: { type: number, example: 100, description: Jarak maksimal HP ke titik patroli saat scan (meter) }
        patrol_max_offline_hours: { type: integer, example: 24, description: Batas umur scan offline yang masih diterima (jam) }
        face_mobile_accuracy: { type: number, example: 0.75, description: Skor kecocokan wajah (0-1) yang dibutuhkan HP untuk menyatakan wajah cocok }
        login_max_failed_attempts: { type: integer, example: 3, description: Jumlah salah password sebelum akun dikunci }
        login_lock_minutes: { type: integer, example: 5, description: Lama akun dikunci (menit) }
        access_token_ttl_minutes: { type: integer, example: 60, description: Masa berlaku access token (menit) }
        refresh_token_ttl_days: { type: integer, example: 30, description: Berapa lama tetap login tanpa memasukkan password (hari) }
    ProfileResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/User'
                - type: object
                  properties:
                    settings: { $ref: '#/components/schemas/AppSettings' }
    Setting:
      type: object
      properties:
        key: { type: string, example: patrol_location_radius_meters }
        level: { type: string, enum: [global, unit], description: Level daftar ini }
        group: { type: string, enum: [patrol, face, security] }
        type: { type: string, enum: [integer, number, boolean] }
        value: { description: Nilai saat ini (number atau boolean), example: 100 }
        default_value: { description: Nilai default, example: 100 }
        is_default: { type: boolean }
        global_value: { description: Nilai global dari pusat, example: 100 }
        is_inherited: { type: boolean, description: 'true jika unit belum mengisi nilai sendiri dan mengikuti nilai global (selalu false untuk level global)' }
        min: { type: number, nullable: true, example: 1 }
        max: { type: number, nullable: true, example: 10000 }
        unit: { type: string, example: meters }
        description: { type: string }
        updated_by: { type: integer, format: int64, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    Branding:
      type: object
      properties:
        app_name: { type: string, example: Secure Patrol }
        logo_base64: { type: string, nullable: true, description: 'Logo dalam base64 standar; null = pakai logo bawaan aplikasi' }
        logo_mime_type: { type: string, nullable: true, example: image/png }
        logo_updated_at: { type: string, format: date-time, nullable: true, description: Berubah setiap logo diganti atau dihapus }
        updated_at: { type: string, format: date-time }
    BrandingResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Branding' }
    UpdateBrandingRequest:
      type: object
      required: [app_name]
      properties:
        app_name: { type: string, maxLength: 100, example: Secure Patrol }
        logo: { type: string, format: binary, description: 'Opsional. JPEG/PNG, maksimal 1 MB' }
        remove_logo: { type: boolean, default: false, description: 'true = hapus logo, aplikasi memakai logo bawaan' }
    SettingsResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Setting' }
