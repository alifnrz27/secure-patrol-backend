openapi: 3.0.3
info:
  title: Secure Patrol API
  version: 1.0.0
  description: |
    Dokumentasi API Secure Patrol. **Hanya tersedia di environment development** (`APP_ENV=development`).

    ## Cara mencoba API di halaman ini
    1. Klik **Authorize**, isi **AppId** (`X-App-Id`) dan **AppKey**. App Key hanya dipakai browser untuk
       menandatangani request dan **tidak pernah dikirim** ke server.
    2. Panggil `POST /auth/login`. Access token otomatis dipasang ke **BearerAuth**.
    3. Endpoint lain siap dicoba.

    Belum punya App ID/Key? Jalankan `go run . create-app-client -name "Dev Docs" -platform web`.

    ## Keamanan request
    Setiap request ke `/api/v1` wajib ditandatangani dengan header `X-App-Id`, `X-Timestamp`, `X-Nonce`, dan
    `X-Signature`. Halaman ini membuat ketiga header terakhir secara otomatis.

    ```
    payload   = METHOD \n REQUEST_URI \n TIMESTAMP \n NONCE \n SHA256_HEX(BODY)
    signature = HEX(HMAC_SHA256(APP_KEY, payload))
    ```

    Detail lengkap dan contoh kode mobile ada di `docs/AUTH.md`.

    ## Pembatasan platform
    **Login per platform:** App Client `android` dan `ios` hanya untuk role unit (Kepala Keamanan, Admin Keamanan,
    Tim Keamanan, dan role kustom); Super-Admin dan Manager Keamanan (pusat) ditolak. App Client `web` (dan `server`)
    hanya untuk Super-Admin, Manager Keamanan, Kepala Keamanan, dan Admin Keamanan. Role yang ditolak mendapat `403`
    `your role is not allowed to sign in on this platform` saat login, refresh, maupun request berikutnya.

    User management, role management, dan app client management **hanya bisa diakses dari App Client
    platform `web`**. Dari platform lain (android, ios, server) endpoint tersebut mengembalikan `403`
    dengan pesan `This feature is only available on the web platform`. Hal yang sama berlaku untuk
    membuat, mengubah, dan menghapus patrol point dan patrol shift.

    Sebaliknya, `POST /patrol-scans` **hanya bisa dari platform `android` atau `ios`**.

    ## Unit (multi unit)
    - **Pusat**: Super-Admin (admin pusat) dan Manager Keamanan tidak punya unit (`unit_id` = `null`) dan melihat
      data **semua unit**. Endpoint daftar menerima filter `unit_id`. Manager Keamanan hanya memantau (baca saja).
    - **Unit**: Kepala Keamanan, Admin Keamanan, Tim Keamanan (dan role custom) wajib punya satu unit dan hanya
      melihat data unitnya sendiri. Filter `unit_id` diabaikan untuk mereka; data unit lain dijawab `404`.
    - Patrol point, shift, dan user unit dikelola oleh **Kepala/Admin Keamanan** unit tersebut. Pusat tidak bisa
      membuat/mengubah patrol point dan shift. Master unit, role, app client, help desk, dan setting global
      dikelola Super-Admin.
    - Setting berlaku per unit: nilai global dari Super-Admin dipakai semua unit, kecuali unit mengisi nilainya
      sendiri. Login, refresh, `/auth/me`, dan `/app-config` memakai setting unit user tersebut.
    - Unit yang dinonaktifkan: semua user unit itu tidak bisa login dan token yang sudah ada langsung ditolak
      (`403 your unit is inactive, contact the head office`).
    - Kode NFC unik di **semua unit**.

    ## Penghapusan data
    Semua endpoint `DELETE` melakukan **soft delete**: data disembunyikan dari API tetapi tetap tersimpan di
    database (kolom `deleted_at`). Nilai unik milik data yang dihapus (email user, kode NFC, kode role) dilepas
    sehingga bisa dipakai lagi, dan history patroli tetap menampilkan user yang sudah dihapus.

    ## Format response
    Semua response JSON dibungkus dalam `{ "meta": { "message", "code", "status" }, "data": ... }`.
servers:
  - url: /api/v1
tags:
  - name: Auth
    description: Login, token, dan profil user yang sedang login
  - name: Units
    description: Master data unit (Super-Admin)
  - name: Roles
    description: Manajemen role
  - name: Users
    description: Manajemen user
  - name: App Clients
    description: Manajemen App ID & App Key (Super-Admin)
  - name: Patrol Points
    description: Titik patroli yang dipindai petugas melalui tag NFC
  - name: Patrol Shifts
    description: Pengaturan shift (jam mulai dan batas akhir/cut-off)
  - name: Patrol Groups
    description: Group patroli otomatis per shift per tanggal, beserta daftar patroli (salinan NFC)
  - name: Patrol Scans
    description: Scan NFC oleh petugas dan history scan
  - name: Help Desk
    description: Aturan, tata cara penggunaan, dan FAQ untuk petugas
  - name: Audit Log
    description: Riwayat create, update, dan delete (siapa, kapan, dari IP mana)
  - name: Settings
    description: Pengaturan sistem yang bisa diubah tanpa restart (disimpan di database)
  - name: Branding
    description: Nama dan logo aplikasi (diubah Super-Admin)
security:
  - AppId: []
    AppKey: []
    BearerAuth: []

paths:
  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Login dengan email dan password
      description: |
        Akun terkunci setelah `login_max_failed_attempts` kali salah password berturut-turut (default 3) selama
        `login_lock_minutes` menit (default 5); keduanya diatur di `/settings`. Response 429 berisi `data.locked_until`,
        `data.retry_after_seconds`, dan header `Retry-After`. Response berisi `settings` (7 setting untuk aplikasi,
        sesuai unit user) dan `user.unit` (null untuk user pusat). User unit yang unitnya nonaktif mendapat 403.
        Response login menyertakan foto wajah user dalam base64 (`user.face_photo_base64` dan
        `user.face_photo_mime_type`). Pada `/auth/refresh` kedua field ini selalu `null`.
      security:
        - AppId: []
          AppKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Akun tidak aktif, unit user tidak aktif, atau role tidak boleh login di platform App Client ini (misalnya Tim Keamanan di web)', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Akun terkunci sementara, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [Auth]
      summary: Tukar refresh token dengan pasangan token baru
      description: |
        Refresh token hanya bisa dipakai sekali. Simpan refresh token baru dari response.
        Memakai refresh token lama akan mematikan seluruh session.
      security:
        - AppId: []
          AppKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token baru
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/me:
    get:
      operationId: getProfile
      tags: [Auth]
      summary: Profil user yang sedang login
      description: Berisi data user beserta `settings` (7 setting untuk aplikasi).
      responses:
        '200':
          description: Profil user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /app-config:
    get:
      operationId: getAppConfig
      tags: [Auth]
      summary: Pengaturan untuk aplikasi mobile
      description: 'Isi sama dengan `config` pada response login dan refresh. Panggil saat aplikasi dibuka dengan sesi tersimpan.'
      responses:
        '200':
          description: Pengaturan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AppConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me/face-photo:
    get:
      operationId: getMyFacePhoto
      tags: [Auth]
      summary: Foto wajah user yang sedang login
      responses:
        '200': { $ref: '#/components/responses/Image' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Logout dari perangkat ini
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout-all:
    post:
      operationId: logoutAll
      tags: [Auth]
      summary: Logout dari semua perangkat
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/change-password:
    put:
      operationId: changePassword
      tags: [Auth]
      summary: Ganti password sendiri
      description: Semua perangkat lain otomatis logout; perangkat ini tetap login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /units:
    get:
      operationId: listUnits
      tags: [Units]
      summary: Daftar unit
      description: 'Semua user yang login, semua platform. User unit hanya melihat unitnya sendiri.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - name: is_active
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Daftar unit, diurutkan berdasarkan nama
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Unit' }
                          pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createUnit
      tags: [Units]
      summary: Tambah unit
      description: |
        **Hanya platform web.** Akses: Super-Admin. Kode unit disimpan dalam huruf besar dan harus unik.
        Unit baru otomatis mendapat 3 shift default (08:00-16:00, 16:00-24:00, 00:00-08:00) yang bisa diubah unit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUnitRequest' }
      responses:
        '201':
          description: Unit dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnitResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /units/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getUnit
      tags: [Units]
      summary: Detail unit
      description: 'User unit hanya bisa membuka unitnya sendiri (unit lain 404).'
      responses:
        '200':
          description: Detail unit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnitResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateUnit
      tags: [Units]
      summary: Ubah unit
      description: |
        **Hanya platform web.** Akses: Super-Admin.
        `is_active: false` membuat semua user unit ini tidak bisa login dan token yang sudah ada langsung ditolak.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUnitRequest' }
      responses:
        '200':
          description: Unit diubah
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnitResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: deleteUnit
      tags: [Units]
      summary: Hapus unit (soft delete)
      description: |
        **Hanya platform web.** Akses: Super-Admin. Hanya unit tanpa user dan patrol point yang bisa dihapus
        (`409` jika masih ada). Untuk menutup unit sementara, nonaktifkan saja. Kode unit bisa dipakai lagi.
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /roles:
    get:
      operationId: listRoles
      tags: [Roles]
      summary: Daftar role
      description: '**Hanya platform web.** Akses baca: Super-Admin, Manager Keamanan, Kepala Keamanan, Admin Keamanan (untuk form user). Role berlaku untuk semua unit dan hanya diubah Super-Admin.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Daftar role
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Role' }
                          pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createRole
      tags: [Roles]
      summary: Tambah role
      description: '**Hanya platform web.** Akses: Super-Admin.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: Role dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /roles/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getRole
      tags: [Roles]
      summary: Detail role
      description: '**Hanya platform web.** Akses: Super-Admin, Manager Keamanan, Admin Keamanan.'
      responses:
        '200':
          description: Detail role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateRole
      tags: [Roles]
      summary: Ubah role
      description: '**Hanya platform web.** Akses: Super-Admin. Kode role tidak bisa diubah; role sistem tidak bisa dinonaktifkan.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: Role diubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: deleteRole
      tags: [Roles]
      summary: Hapus role (soft delete)
      description: '**Hanya platform web.** Akses: Super-Admin. Role sistem dan role yang masih dipakai user tidak bisa dihapus. Kode role yang dihapus bisa dipakai lagi.'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users:
    get:
      operationId: listUsers
      tags: [Users]
      summary: Daftar user
      description: '**Hanya platform web.** Akses: Super-Admin, Manager Keamanan (semua unit); Kepala Keamanan, Admin Keamanan (unitnya sendiri).'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/UnitId'
        - name: head_office
          in: query
          description: '`true` = hanya user pusat (tanpa unit). Hanya untuk user pusat.'
          schema: { type: boolean }
        - name: role_id
          in: query
          schema: { type: integer, format: int64 }
        - name: is_active
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Daftar user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/User' }
                          pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createUser
      tags: [Users]
      summary: Tambah user
      description: |
        **Hanya platform web.**
        Akses: Super-Admin, Kepala Keamanan, Admin Keamanan. Manager Keamanan hanya memantau.
        - Role pusat (Super-Admin, Manager Keamanan) hanya bisa diberikan Super-Admin dan tidak punya unit
          (`unit_id` diabaikan).
        - Role unit wajib punya unit. Super-Admin wajib mengisi `unit_id` (`422 unit_id is required for this role`);
          Kepala/Admin Keamanan selalu membuat user di unitnya sendiri.
        Foto wajah wajib, JPEG/PNG maksimal 5 MB, dan diperiksa server sebelum disimpan: harus berisi **tepat satu
        wajah**, cukup besar (minimal 20% sisi pendek foto), dan **menghadap kamera** dengan kedua mata terlihat.
        Orientasi EXIF foto HP diperhitungkan.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/FacePhotoRejected' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getUser
      tags: [Users]
      summary: Detail user
      description: '**Hanya platform web.**'
      responses:
        '200':
          description: Detail user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateUser
      tags: [Users]
      summary: Ubah user
      description: |
        **Hanya platform web.**
        Foto wajah opsional; jika dikirim, foto diperiksa seperti saat membuat user dan foto lama diganti.
        Jika foto ditolak, tidak ada data yang berubah.
        Menonaktifkan user, mengganti role, atau memindahkan unit-nya langsung mematikan semua session user tersebut.
        User tidak bisa menonaktifkan, mengganti role, atau memindahkan unit akunnya sendiri.
        `unit_id` kosong = tetap di unit sekarang. Hanya Super-Admin yang bisa memindahkan user ke unit lain.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User diubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/FacePhotoRejected' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
    delete:
      operationId: deleteUser
      tags: [Users]
      summary: Hapus user (soft delete)
      description: '**Hanya platform web.** Email user yang dihapus bisa dipakai lagi untuk user baru.'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/{id}/face-photo:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getUserFacePhoto
      tags: [Users]
      summary: Foto wajah user
      description: '**Hanya platform web.**'
      responses:
        '200': { $ref: '#/components/responses/Image' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/{id}/reset-password:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: resetUserPassword
      tags: [Users]
      summary: Reset password user
      description: '**Hanya platform web.** Juga membuka kunci akun dan mematikan semua session user tersebut.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /app-clients:
    get:
      operationId: listAppClients
      tags: [App Clients]
      summary: Daftar app client
      description: '**Hanya platform web.**'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Daftar app client
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
