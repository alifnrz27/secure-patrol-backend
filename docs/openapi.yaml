      summary: Foto scan
      responses:
        '200': { $ref: '#/components/responses/Image' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /help-desk-articles:
    get:
      operationId: listHelpDeskArticles
      tags: [Help Desk]
      summary: Daftar artikel help desk (aturan, tata cara, FAQ)
      description: |
        Semua user yang login, semua platform. Diurutkan: `rule`, `guide`, lalu `faq`, kemudian `sort_order`.
        Help desk berlaku untuk semua unit. Super-Admin dan Manager Keamanan juga melihat draft; role lain hanya
        artikel yang sudah dipublikasikan.
      parameters:
