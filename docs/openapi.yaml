      summary: Group yang sedang berjalan beserta daftar patroli
      description: |
        Untuk layar utama aplikasi mobile: group unit user yang sedang berjalan. User pusat wajib mengisi
        `unit_id` (`422 unit_id is required`). Mengembalikan 422 jika tidak ada shift aktif saat ini.
